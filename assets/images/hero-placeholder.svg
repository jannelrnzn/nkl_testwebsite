<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!--
    Abstrakter Platzhalter fuer das Firmengelaende der NKL GmbH.
    Wird spaeter durch ein echtes Hintergrundvideo vom Standort
    Wolpertshausen ersetzt (siehe .hero__video in style.css).
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d5a78"/>
      <stop offset="100%" stop-color="#0f2438"/>
    </linearGradient>
    <linearGradient id="hallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5b6b"/>
      <stop offset="100%" stop-color="#333f4a"/>
    </linearGradient>
    <linearGradient id="hallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d7285"/>
      <stop offset="100%" stop-color="#3a4855"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Ferner Hallenkomplex -->
  <g opacity="0.6">
    <rect x="0" y="520" width="420" height="160" fill="url(#hallA)"/>
    <rect x="380" y="470" width="260" height="210" fill="url(#hallA)"/>
    <polygon points="380,470 510,410 640,470" fill="#455565"/>
  </g>

  <!-- Hauptgebaeude / Produktionshalle -->
  <g>
    <rect x="560" y="440" width="620" height="260" fill="url(#hallB)"/>
    <polygon points="560,440 870,340 1180,440" fill="#4a5b6b"/>
    <!-- Fensterreihe -->
    <g fill="#1b2733" opacity="0.7">
      <rect x="610" y="500" width="60" height="70"/>
      <rect x="700" y="500" width="60" height="70"/>
      <rect x="790" y="500" width="60" height="70"/>
      <rect x="880" y="500" width="60" height="70"/>
      <rect x="970" y="500" width="60" height="70"/>
      <rect x="1060" y="500" width="60" height="70"/>
    </g>
    <!-- Eingang -->
    <rect x="1000" y="600" width="100" height="100" fill="#0f2438"/>
  </g>

  <!-- Nebengebaeude rechts -->
  <g opacity="0.85">
    <rect x="1180" y="500" width="300" height="200" fill="url(#hallA)"/>
    <rect x="1230" y="440" width="60" height="60" fill="#3a4855"/>
  </g>

  <!-- Schornstein / Lueftungsturm als technisches Detail -->
  <rect x="1310" y="360" width="34" height="150" fill="#556777"/>
  <rect x="1305" y="350" width="44" height="16" fill="#66798a"/>

  <!-- Vordergrund: Bodenflaeche / Vorplatz -->
  <rect x="0" y="700" width="1600" height="200" fill="#1b2530"/>
  <rect x="0" y="700" width="1600" height="6" fill="#2c3948"/>

  <!-- Dezente horizontale Lichtlinie als gestalterisches Element -->
  <rect x="0" y="440" width="1600" height="2" fill="#7fa5c9" opacity="0.25"/>
</svg>
